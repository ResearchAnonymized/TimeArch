# TimeArch — local Supabase configuration (self-hosted / CLI).
# Self-hosted local stack.

project_id = "timearch-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
# Deprecated section name still accepted; Mailpit UI on this port.
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8082"
additional_redirect_urls = [
  "http://localhost:8080",
  "http://localhost:8081",
  "http://localhost:8082",
  "http://127.0.0.1:8080",
  "http://127.0.0.1:8081",
  "http://127.0.0.1:8082",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local convenience: skip email confirmation so Phase 1 works without SMTP.
enable_confirmations = false
secure_password_change = false

[auth.email.template.invite]
subject = "You have been invited to TimeArch"
[auth.email.template.confirmation]
subject = "Confirm your TimeArch email"
[auth.email.template.recovery]
subject = "Reset your TimeArch password"
[auth.email.template.magic_link]
subject = "Your TimeArch magic link"
[auth.email.template.email_change]
subject = "Confirm your new TimeArch email"

# Google OAuth is optional — configure in Dashboard / env when needed.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"
# Local GoTrue + Google occasionally fail nonce checks; safe for local/dev.
skip_nonce_check = true

[edge_runtime]
enabled = true
policy = "per_worker"

# ─── Edge function JWT verification ─────────────────────────────────────────
[functions.auth-email-hook]
  verify_jwt = false
[functions.generate-document]
  verify_jwt = true
[functions.handle-email-suppression]
  verify_jwt = false
[functions.handle-email-unsubscribe]
  verify_jwt = false
[functions.preview-transactional-email]
  verify_jwt = false
[functions.process-email-queue]
  verify_jwt = true
[functions.process-requirements]
  verify_jwt = true
[functions.process-audio-requirements]
  verify_jwt = true
[functions.run-agent]
  verify_jwt = true
[functions.run-agent-v2]
  verify_jwt = true
[functions.seed-knowledge]
  verify_jwt = false
[functions.send-transactional-email]
  verify_jwt = true
[functions.list-prompts]
  verify_jwt = true
[functions.update-prompt]
  verify_jwt = true
[functions.system-disposition-analyzer]
  verify_jwt = true
[functions.issue-api-token]
  verify_jwt = true
[functions.public-api]
  verify_jwt = false
[functions.mcp-server]
  verify_jwt = false
[functions.list-openrouter-models]
  verify_jwt = true
